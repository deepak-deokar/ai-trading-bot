[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-bot"
version = "0.1.0"
description = "Safety-first personal trading research infrastructure"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1", "uvicorn==0.35.0", "pydantic==2.11.7",
  "pydantic-settings==2.10.1", "SQLAlchemy==2.0.43",
  "pandas-market-calendars==5.4.0", "numpy==2.5.3",
  "psycopg[binary]==3.2.9", "alembic==1.16.5", "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1", "pytest-cov==6.2.1", "httpx==0.28.1",
  "ruff==0.12.11", "black==25.1.0", "mypy==1.17.1",
  "pre-commit==4.3.0", "types-PyYAML==6.0.12.20250822",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["integration: requires a migrated PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 88
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.black]
target-version = ["py312"]
line-length = 88
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandas_market_calendars.*"]
ignore_missing_imports = true
