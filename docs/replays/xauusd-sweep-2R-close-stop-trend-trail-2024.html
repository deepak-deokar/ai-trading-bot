<title>Sweep Replay 2024</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Trade replay page, filled by trading_bot.backtesting.trade_replay.render_page.
   Layout: one column; replay chart beside a result panel, stacked on phones. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #1b2230; --muted: #5d6779; --line: #dde1e8;
  --gold: #a87a12; --gold-soft: rgba(196,150,40,.16);
  --up: #1f8a5b; --down: #c4423a; --up-soft: rgba(31,138,91,.14); --down-soft: rgba(196,66,58,.14);
  --info: #3d63c9; --info-soft: rgba(61,99,201,.13);
  --f-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: Inter, -apple-system, "Segoe UI", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --panel: #1a1f28; --fg: #e7eaf0; --muted: #98a2b4; --line: #2c3340;
  --gold: #e0b44a; --gold-soft: rgba(224,180,74,.15);
  --up: #3fbf86; --down: #ef6b62; --up-soft: rgba(63,191,134,.16); --down-soft: rgba(239,107,98,.16);
  --info: #7f9ef0; --info-soft: rgba(127,158,240,.16); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1a1f28; --fg: #e7eaf0; --muted: #98a2b4; --line: #2c3340;
  --gold: #e0b44a; --gold-soft: rgba(224,180,74,.15);
  --up: #3fbf86; --down: #ef6b62; --up-soft: rgba(63,191,134,.16); --down-soft: rgba(239,107,98,.16);
  --info: #7f9ef0; --info-soft: rgba(127,158,240,.16); color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--f-body); }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 32px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(24px, 4vw, 34px); line-height: 1.15; }
h2 { font-size: 21px; } h3 { font-size: 16px; }
p { margin: 0; max-width: 68ch; }
.muted { color: var(--muted); }
.eyebrow { font: 600 12px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
section { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--muted); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -1px; margin-right: 6px; }
.neg { color: var(--down); } .pos { color: var(--up); }
.replay { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; }
@media (max-width: 820px) { .replay { grid-template-columns: 1fr; } }
canvas { display: block; width: 100%; }
#cv { height: 420px; }
@media (max-width: 600px) { #cv { height: 320px; } }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
button, select { font: 500 14px var(--f-body); color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 7px 12px; cursor: pointer; }
button:hover, select:hover { border-color: var(--gold); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button.primary { background: var(--gold); border-color: var(--gold); color: #fff; font-weight: 600; min-width: 84px; }
.caption { margin-top: 12px; padding: 10px 12px; border-radius: 6px; background: var(--bg); font-size: 14px; min-height: 48px; }
.side { display: grid; gap: 12px; align-content: start; min-width: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13.5px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.pnl-big { font: 700 28px var(--f-mono); font-variant-numeric: tabular-nums; }
.chip { display: inline-block; font: 600 11.5px var(--f-body); letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; }
.chip.target { background: var(--up-soft); color: var(--up); }
.chip.stop { background: var(--down-soft); color: var(--down); }
.chip.time_exit { background: var(--info-soft); color: var(--info); }
.chip.trail { background: var(--gold-soft); color: var(--gold); }
.trade-list { display: flex; flex-wrap: wrap; gap: 6px; }
.trade-list button { padding: 4px 8px; font: 600 12px var(--f-mono); border-left-width: 4px; }
.trade-list button.target { border-left-color: var(--up); }
.trade-list button.stop { border-left-color: var(--down); }
.trade-list button.time_exit { border-left-color: var(--info); }
.trade-list button.trail { border-left-color: var(--gold); }
.trade-list button[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); }
.wf { display: grid; gap: 6px; font-size: 13px; }
.wf-row { display: grid; grid-template-columns: 112px 1fr 64px; gap: 8px; align-items: center; }
.wf-row .t { position: relative; height: 14px; }
.wf-row .t i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.wf-row .v { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
#eq { height: 220px; }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; max-width: 70ch; }
</style>

<div class="wrap">
  <header style="display:grid;gap:10px">
    <div class="eyebrow">Trade replay · XAUUSD</div>
    <h1 id="title"></h1>
    <p class="muted" id="subtitle"></p>
  </header>

  <section>
    <div class="panel"><div class="trade-list" id="list" aria-label="Choose a trade"></div></div>
    <div class="replay">
      <div class="panel">
        <canvas id="cv" aria-label="Candle chart of the selected trade"></canvas>
        <div class="controls">
          <button class="primary" id="play">Play</button>
          <button id="back" aria-label="One candle back">◀ Step</button>
          <button id="fwd" aria-label="One candle forward">Step ▶</button>
          <button id="end">Show result</button>
          <label for="speed" class="muted" style="margin-left:auto">Speed</label>
          <select id="speed"><option value="420">Slow</option><option value="180" selected>Normal</option><option value="60">Fast</option></select>
        </div>
        <div class="caption" id="cap"></div>
        <div class="legend" style="margin-top:10px">
          <span><i class="sw" style="background:var(--gold-soft);outline:1px solid var(--gold)"></i>Zone</span>
          <span><i class="sw" style="background:var(--info-soft);outline:1px solid var(--info)"></i>Setup candles</span>
          <span><i class="sw" style="background:var(--fg)"></i>Entry</span>
          <span><i class="sw" style="background:var(--down)"></i>Stop</span>
          <span><i class="sw" style="background:var(--up)"></i>Target</span>
        </div>
      </div>
      <div class="side">
        <div class="panel" style="display:grid;gap:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <span class="mono" id="t-title"></span><span class="chip" id="t-chip"></span>
          </div>
          <div class="muted" style="font-size:13px" id="pnl-lbl">Profit / loss right now</div>
          <div class="pnl-big" id="pnl">–</div>
          <dl class="kv" id="kv"></dl>
        </div>
        <div class="panel" style="display:grid;gap:10px">
          <h3>Where the money went</h3>
          <div class="wf" id="wf"></div>
          <p class="muted" style="font-size:12.5px">Price move is measured on the mid price. Costs come off whether the trade wins or loses.</p>
        </div>
      </div>
    </div>
    <div class="panel" style="display:grid;gap:8px" id="rules-box">
      <h3>The rules being replayed</h3>
      <ol class="steps" id="rules"></ol>
    </div>
  </section>

  <section>
    <h2 id="eq-title">All trades, added up</h2>
    <div class="panel"><canvas id="eq" aria-label="Running total of all trades"></canvas></div>
    <p class="muted" id="eq-note"></p>
  </section>
</div>
